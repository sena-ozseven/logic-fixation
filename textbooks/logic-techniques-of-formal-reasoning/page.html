<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page — Logic: Techniques of Formal Reasoning</title>
    <link rel="stylesheet" href="/assets/css/base.css" />
  </head>
  <body>
    <div data-site-header></div>

    <div class="reader-container">

      <!-- Book title + page badge bar -->
      <header class="reader-page-bar">
        <span class="reader-book-title">Logic: Techniques of Formal Reasoning</span>
        <span class="reader-page-badge" data-page-label>Page 1</span>
      </header>

      <div class="reader-layout">

        <!-- ── Left: PDF viewer ── -->
        <div class="reader-pdf">

          <!-- Navigation bar -->
          <nav class="reader-controls" aria-label="Page navigation">
            <div class="reader-nav-group">
              <a data-nav-prev href="#" aria-label="Previous page">← Prev</a>
              <a data-nav-jump-back href="#" aria-label="Back 10 pages">−10</a>
            </div>

            <div class="reader-nav-center">
              <form data-go-form class="reader-go-form">
                <label for="go-input" class="sr-only">Page number</label>
                <input
                  id="go-input"
                  type="number"
                  min="1"
                  value="1"
                  data-go-input
                  aria-label="Go to page"
                />
                <button type="submit" class="btn-secondary">Go</button>
              </form>
              <span class="reader-total-pages" data-total-pages></span>
            </div>

            <div class="reader-nav-group">
              <a data-nav-jump-forward href="#" aria-label="Forward 10 pages">+10</a>
              <a data-nav-next href="#" aria-label="Next page">Next →</a>
            </div>
          </nav>

          <!-- PDF page image -->
          <div class="reader-pdf-body">
            <img
              data-page-img
              class="page-img"
              alt="Page 1 of Logic: Techniques of Formal Reasoning"
              src=""
            />
            <p class="muted reader-back-link">
              <a href="/textbooks/logic-techniques-of-formal-reasoning/">← Back to textbook contents</a>
            </p>
          </div>

        </div>

        <!-- ── Right: Solutions panel ── -->
        <aside class="reader-panel">

          <!-- Panel header -->
          <div class="panel-section">
            <h2 data-panel-title>Solutions — Page 1</h2>
            <p class="muted" style="font-size:0.825rem; margin:0;">
              Notes for this page only. Saved locally in your browser.
            </p>
          </div>

          <!-- Section A: New entry form -->
          <div class="panel-section">
            <p class="panel-section-title">New Entry</p>

            <label for="sol-question">Question</label>
            <input id="sol-question" type="text" data-sol-question />

            <label for="sol-explanation">Explanation</label>
            <textarea id="sol-explanation" data-sol-explanation></textarea>

            <label for="sol-answer">Answer</label>
            <textarea id="sol-answer" data-sol-answer></textarea>

            <!-- Logic symbol keyboard -->
            <div class="symbol-grid" data-sym-grid></div>

            <div class="panel-actions">
              <button type="button" class="btn-primary" data-save-entry>Save Entry</button>
            </div>
            <p class="status" data-panel-status aria-live="polite"></p>
          </div>

          <!-- Section B: Saved entries -->
          <div class="panel-section">
            <p class="panel-section-title" data-entries-heading>Saved — Page 1</p>
            <div data-entries-list></div>
          </div>

          <!-- Section C: Export (collapsed) -->
          <div class="export-section">
            <button type="button" class="export-toggle" data-export-toggle>
              Export page JSON ▸
            </button>
            <div class="export-body" data-export-body>
              <button type="button" class="btn-secondary" data-export-page style="margin-bottom:0.5rem;">
                Generate JSON
              </button>
              <label for="export-out" class="sr-only">Export output</label>
              <textarea id="export-out" data-export-out readonly></textarea>
            </div>
          </div>

        </aside>
      </div>
    </div>

    <div data-site-footer></div>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/pdf-viewer.js"></script>
  </body>
</html>
